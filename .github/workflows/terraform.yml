name: Terraform Validate (reusable)

# Called by validate.yml once per stack. Needs no AWS credentials and no
# state: init runs with -backend=false and the tests use a mocked provider.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Terraform root module to check (relative to repo root)
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  validate:
    name: Format, Validate & Mock Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false -backend=false

      - name: Terraform Validate
        run: terraform validate

      # Plans against a mocked AWS provider (tests/*.tftest.hcl): catches
      # plan-time failures that validate cannot, with no credentials or cost.
      - name: Terraform Test (mocked AWS)
        run: terraform test
